name: Publish package to npm

on:
  release:
    types: [published]

jobs:
  ensure-version-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify package version matches release tag
        run: |
          RELEASE_TAG=${{ github.event.release.tag_name }}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$PKG_VERSION" ]; then
            echo "Error: Release tag '$RELEASE_TAG' does not match package.json version 'v$PKG_VERSION'"
            exit 1
          fi

  build-and-test:
    needs: ensure-version-match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run types:validate

  publish-npm:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run types:validate
      - name: Publish dry-run
        run: npm publish --dry-run --tag next
      - name: Publish to npm
        run: npm publish --tag next
