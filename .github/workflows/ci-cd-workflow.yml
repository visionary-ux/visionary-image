name: Visionary Image CI — Build and test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node-version: 20
            pnpm-version: 10
          - node-version: 22
            pnpm-version: 11.5.1
          - node-version: 24
            pnpm-version: 11.5.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
