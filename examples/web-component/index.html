<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visionary Image — Web component</title>
    <style>
      body {
        margin: 0 auto;
        max-width: 1280px;
        padding: 2% 10%;
      }

      section {
        margin-top: 1.5rem;
      }

      visionary-image {
        display: block;
        max-width: 600px;
      }
    </style>
  </head>
  <body>
    <h1><code>&lt;visionary-image&gt;</code></h1>
    <p>
      Custom element from <code>visionary-image/web-component</code>. For more examples, see Storybook
      <code>(pnpm run storybook)</code>.
    </p>
    <p>
      <a href="/">All examples</a>
      ·
      <a href="/react/">React</a>
    </p>

    <section>
      <h2>Blurhash URL</h2>
      <visionary-image
        alt="White-petaled cherry blossom focused against a blurry background"
        lazy="false"
        src="https://cdn.visionary.cloud/image/Y3Fra2RzdHFwcCEyMDAwITEzMzMhYTdjMWM0IVVuR20zfC5tdFFzLnlGYmNSamFmSW9SUFdCV1dSKk5HVkBqWw/md/image.jpg"
      ></visionary-image>
    </section>

    <section>
      <h2>Ordinary URL fallback</h2>
      <visionary-image
        alt="Fallback image without Blurhash data"
        src="https://upload.wikimedia.org/wikipedia/commons/a/a0/View_of_the_ISS_taken_during_Crew-2_flyaround_%28ISS066-E-081311%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
      ></visionary-image>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
